name: Build Android APK

# main에 푸시하거나, Actions 탭에서 수동 실행(Run workflow)하면 빌드
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Satisfies pubspec.lock without the newer IconData final-class change.
      FLUTTER_VERSION: 3.41.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 고정 서명 키: 매 빌드가 같은 서명이라 앱을 지우지 않고 덮어쓰기 업데이트 가능
      - name: Setup signing
        run: |
          base64 -d android/app/jun-signing.b64 > android/app/jun-release.jks
          cat > android/key.properties <<EOF
          storePassword=loftifyjun
          keyPassword=loftifyjun
          keyAlias=jun
          storeFile=jun-release.jks
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Flutter Pub Get
        run: |
          flutter pub get
          dart run intl_utils:generate

      - name: Generate awesome_chewie localizations
        working-directory: third-party/chewie
        run: |
          flutter pub get
          flutter gen-l10n

      # 번역 모듈 코드 검사: 오류를 주석(annotation)으로 남겨 Actions 화면·API에서 바로 보이게
      - name: Analyze translation code
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/ko lib/main.dart lib/Screens/Post/post_detail_screen.dart lib/Screens/Setting/mobile_setting_navigation_screen.dart > analyze.txt 2>&1
          code=$?
          grep -E "^\s*error " analyze.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          grep -E "^\s*warning " analyze.txt | head -10 | while IFS= read -r l; do echo "::warning::$l"; done
          tail -5 analyze.txt
          exit $code

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64,android-arm 2>&1 | tee build.log || {
            grep -E "Error:|error:|FAILURE|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Loftify-jun.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loftify-jun-apk
          path: build/app/outputs/flutter-apk/Loftify-jun.apk

      # 폰에서 받기 쉽게: Releases의 'latest-build'에 항상 최신 APK를 덮어씀
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: 최신 빌드
          body: "main 브랜치 최신 커밋(${{ github.sha }})으로 자동 빌드된 APK입니다."
          prerelease: true
          files: build/app/outputs/flutter-apk/Loftify-jun.apk
